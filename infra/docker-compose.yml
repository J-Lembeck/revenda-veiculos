name: revenda-veiculos

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?copie .env.example para .env}
      VEHICLES_DB_OWNER_PASSWORD: ${VEHICLES_DB_OWNER_PASSWORD:?}
      VEHICLES_DB_APP_PASSWORD: ${VEHICLES_DB_APP_PASSWORD:?}
      CUSTOMERS_DB_OWNER_PASSWORD: ${CUSTOMERS_DB_OWNER_PASSWORD:?}
      CUSTOMERS_DB_APP_PASSWORD: ${CUSTOMERS_DB_APP_PASSWORD:?}
      SALES_DB_OWNER_PASSWORD: ${SALES_DB_OWNER_PASSWORD:?}
      SALES_DB_APP_PASSWORD: ${SALES_DB_APP_PASSWORD:?}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sales"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs,kms,s3,secretsmanager
      AWS_DEFAULT_REGION: sa-east-1
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_GATEWAY_API_KEY:?copie .env.example para .env}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          r=$$(curl -sf http://localhost:4566/_localstack/init/ready)
          && echo "$$r" | grep -q '"completed": true'
          && ! echo "$$r" | grep -q '"ERROR"'
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?copie .env.example para .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
      SALES_SERVICE_CLIENT_SECRET: ${SALES_SERVICE_CLIENT_SECRET:?}
      CUSTOMERS_SERVICE_CLIENT_SECRET: ${CUSTOMERS_SERVICE_CLIENT_SECRET:?}
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status <&3
          && [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 40

volumes:
  postgres-data:

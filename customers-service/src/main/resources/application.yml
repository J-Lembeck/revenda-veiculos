spring:
  application:
    name: customers-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/customers}
    username: ${DB_APP_USER:customers_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/customers}
    user: ${DB_OWNER_USER:customers_owner}
    password: ${DB_OWNER_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          customers-service:
            provider: revenda
            client-id: ${OIDC_CLIENT_ID:customers-service}
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          revenda:
            token-uri: ${OIDC_CLIENT_TOKEN_URI:${OIDC_TOKEN_URI:http://localhost:8180/realms/revenda/protocol/openid-connect/token}}

server:
  port: 8082

management:
  server:
    port: ${MANAGEMENT_PORT:9082}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

revenda:
  security:
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/revenda}
      roles-claim: ${OIDC_ROLES_CLAIM:realm_access.roles}
      scope-prefix: ${OIDC_SCOPE_PREFIX:}
      web-clients: ${OIDC_WEB_CLIENTS:revenda-web,revenda-postman}
      service-clients: ${OIDC_SERVICE_CLIENTS:sales-service}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
  crypto:
    kms-key-id: ${KMS_CUSTOMER_KEY_ID:alias/customers-data}
  customers:
    require-verified-email: ${CUSTOMERS_REQUIRE_VERIFIED_EMAIL:false}
    zone: ${CUSTOMERS_ZONE:America/Sao_Paulo}
    retention-cron: ${CUSTOMERS_RETENTION_CRON:0 0 3 * * *}
    jobs-enabled: ${CUSTOMERS_JOBS_ENABLED:true}
  neighbors:
    sales-url: ${SALES_BASE_URL:http://localhost:8083}
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:2s}
    read-timeout: ${HTTP_READ_TIMEOUT:2s}
  openapi:
    title: Cadastro de compradores
    description: >-
      O cadastro do comprador, feito por ele mesmo, com o dado pessoal cifrado no banco. CPF, e-mail e telefone saem
      sempre mascarados; o e-mail vem da conta, pelo token. Erros no formato `ApiError` com `code` estável.
    authorization-url: ${OIDC_AUTHORIZATION_URI:http://localhost:8180/realms/revenda/protocol/openid-connect/auth}
    token-url: ${OIDC_TOKEN_URI:http://localhost:8180/realms/revenda/protocol/openid-connect/token}

springdoc:
  default-produces-media-type: application/json
  override-with-generic-response: false
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    oauth:
      client-id: ${OIDC_SWAGGER_CLIENT_ID:revenda-web}
      use-pkce-with-authorization-code-grant: true
      scopes: openid

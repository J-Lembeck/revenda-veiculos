spring:
  application:
    name: vehicles-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/vehicles}
    username: ${DB_APP_USER:vehicles_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/vehicles}
    user: ${DB_OWNER_USER:vehicles_owner}
    password: ${DB_OWNER_PASSWORD}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

revenda:
  security:
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/revenda}
      roles-claim: ${OIDC_ROLES_CLAIM:realm_access.roles}
      scope-prefix: ${OIDC_SCOPE_PREFIX:}
      web-clients: ${OIDC_WEB_CLIENTS:revenda-web}
      service-clients: ${OIDC_SERVICE_CLIENTS:sales-service}
  vehicle-commands:
    enabled: ${VEHICLE_COMMANDS_ENABLED:true}
    queue-url: ${VEHICLE_COMMANDS_QUEUE_URL:http://localhost:4566/000000000000/vehicle-commands.fifo}
  openapi:
    title: Estoque de veículos
    description: >-
      Cadastro, edição, vitrine e vendidos do estoque, e a reserva que a compra pede. Dinheiro sempre em centavos
      inteiros (`priceCents`), instantes em ISO-8601 UTC, erros no formato `ApiError` com `code` estável.
    authorization-url: ${OIDC_AUTHORIZATION_URI:http://localhost:8180/realms/revenda/protocol/openid-connect/auth}
    token-url: ${OIDC_TOKEN_URI:http://localhost:8180/realms/revenda/protocol/openid-connect/token}

springdoc:
  default-produces-media-type: application/json
  override-with-generic-response: false
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    oauth:
      client-id: ${OIDC_SWAGGER_CLIENT_ID:revenda-web}
      use-pkce-with-authorization-code-grant: true
      scopes: openid

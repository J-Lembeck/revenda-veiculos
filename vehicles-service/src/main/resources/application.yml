spring:
  application:
    name: vehicles-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/vehicles}
    username: ${DB_APP_USER:vehicles_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/vehicles}
    user: ${DB_OWNER_USER:vehicles_owner}
    password: ${DB_OWNER_PASSWORD}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

revenda:
  security:
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/revenda}
      roles-claim: ${OIDC_ROLES_CLAIM:realm_access.roles}
      scope-prefix: ${OIDC_SCOPE_PREFIX:}
      web-clients: ${OIDC_WEB_CLIENTS:revenda-web}
      service-clients: ${OIDC_SERVICE_CLIENTS:sales-service}
  vehicle-commands:
    enabled: ${VEHICLE_COMMANDS_ENABLED:true}
    queue-url: ${VEHICLE_COMMANDS_QUEUE_URL:http://localhost:4566/000000000000/vehicle-commands.fifo}

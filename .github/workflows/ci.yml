name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: módulos afetados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.select.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: select
        name: Escolher os serviços a verificar
        env:
          EVENT: ${{ github.event_name }}
        run: bash .github/scripts/affected-modules.sh >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes do serviço
        env:
          MODULE: ${{ matrix.module }}
        run: ./mvnw -B verify -pl "$MODULE" -am

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.module }}
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
          retention-days: 14

  result:
    name: resultado
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir os jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "módulos afetados: $CHANGES; serviços: $VERIFY"
          [[ "$CHANGES" == "success" ]]
          [[ "$VERIFY" == "success" || "$VERIFY" == "skipped" ]]
